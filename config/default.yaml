blocks:  # blocks of pipeline to run
  meta: False         # pack main metadata into HDF5
  DLC: False        # Deep lab cut
  MoSeq: False        # MoSeq
  descendants: False   # speed, HD etc. from MoSeq and others
  Audio: False       # process audio data
  LFP: False          # extract LFP
  neurosuite: False  # sorting with neurosuite / klustakwik
  kilosort: False  # sorting with kilosort
  units: False      # complete spike sorting with neurosuite / klustakwik
  AEPs: False         # extract Auditory Evoked Responses
  PSTH_bar: False
  PSTH_bootstrap: False
  PSTH_shuffle: False
  spatial: False
  population: False
  coherence: False
  manifold_states: False
  metronome: False
  video: False
  CCR: False
  raw_waveforms: False # extract raw waveforms for unit matching (session level)
  unit_match: False # run unit matching across all sessions of an animal

src_path: "/mnt/nevermind.data-share/ag-grothe/AG_Pecka/data/raw/"
dst_path: "/mnt/nevermind.data-share/ag-grothe/AG_Pecka/data/processed/"
prj_path: "/mnt/nevermind.data-share/ag-grothe/AG_Pecka/projects/default_project/"

pack:
  drift_coeff: 0.000016666
  adc_sync:
    enabled: false
    f_lo: 600.0
    f_hi: 1400.0

# neurosuite / klustakwik config files
template_xml: "/mnt/nevermind.data-share/ag-grothe/AG_Pecka/data/raw/60/60_SIT_2023-08-11_16-23-36/60_SIT_2023-08-11_16-23-36.xml"
template_manual_json: "/mnt/nevermind.data-share/ag-grothe/AG_Pecka/data/raw/60/60_SIT_2023-08-11_16-23-36/manual.json"
ndm_path: "/mnt/nevermind.data-share/ag-grothe/AG_Pecka/apps/ndm/usr/bin/"
kkwik_path: "/home/sobolev/apps/kkwik/"
kwik_args: "-PenaltyMix 1.0 -MinClusters 85 -MaxClusters 85 -MaxPossibleClusters 200 -UseFeatures"

kilosort:
  settings_path: "/mnt/nevermind.data-share/ag-grothe/AG_Pecka/data/raw/013829/kilosort.json"
  probe_path: "/mnt/nevermind.data-share/ag-grothe/AG_Pecka/data/raw/013829/probe.json"
  save_preprocessed: False

# single units config: which sorter to use
units:
  source: 'neurosuite'

# deep lab cut config files
dlc_config_path: "/mnt/nevermind.data-share/ag-grothe/Miguel/DeepLabCut/TrainedModels/implantedSIT-Miguel-2023-06-23/config.yaml"
dlc_shuffle: 3
dlc_trainingsetindex: 0
cuda_device_to_use: 3

# moseq config files
moseq_model_path: '/mnt/nevermind.data-share/ag-grothe/Miguel/MoSeq/TrainedModels/hippoSIT2023_noTail_unfiltered/2023_07_13-15_08_10'

# LFP configuration
lfp:
  n_channels: 384
  source_rate: 30000 # original LFP sampling rate in Hz
  target_rate: 1000  # target LFP sampling rate in Hz
  chunk_size_sec: 10  # chunk size for conversion in seconds
  aep_dur: 0.25  # Auditory evoked response duration in sec
  aep_pre: 0.12
  aep_sig: 0.125
  artifacts:
    z_thresh: 8.0
    win_ms: 200
    step_ms: 100
    min_dur_ms: 500
    merge_gap_ms: 2000
  aep_ITPC:
    area: 'A1'
    metric: 'avg_across_channels'  # weighted_avg, zscored_avg, raw_AEPs (last is 2D)
  baseline:
    min_duration_ms: 500
    stationary_thresh: 0.04  # m/s
  EV_SU:
    kernel_sizes: [0, 4, 8, 12, 16]
# AEP configuration
AEPs:
  speed_thresh: 0.04  # m/s

sound_phase_lock:
  n_shuffles: 100
  ipi_for_shuffle: 0.25
  
# analysis configurations
psth:
  micro:
    latency: 0.25
    bin_count: 51
    shuf_iter_count: 100
  macro:
    latency: 7.25
    bin_count: 31
  bootstrap:
    latency: 0.25
    bin_count: 51
    boot_iter_count: 100
    # xlim: [-0.25, 0.25] # if not specified , defaults to [-latency, latency]

# neural manifolds
nMAP_electrodes:
    '009265': [1, 2]
    '009266': [1, 2]
    '57': [1]
    '60': [1, 2]

nMAP_segmentation:
  ft: 'tSNE'
  fp: 70
  speed_thresh: 0.04  # m/s
  margin: 5
  sigma: 0.1
  bin_count: 100
  shuffle_iter_count: 100

# behavioral manifolds
bMAP_segmentation:
  ft: 'tSNE'
  fp: 70
  speed_thresh: 0.04  # m/s
  margin: 5
  sigma: 0.12
  bin_count: 100
  shuffle_iter_count: 100

# metronome
metronome:
  split_ratio: 0.5

# Evoked / sustained manifold
nMAP_EV_SU:
  bin_size: 0.01
  ev_su_lag: 0.12
  k_width: 200  # sampled as activity matrix bins (10ms)
  smooth_su_size: 4  #  rectangular kernel size to smooth sustained part
  smooth_ev_size: 20  #  gaussian kernel size to smooth evoked part

# unit matrix + video merging
video:
  duration: 300  # in seconds
  overlap: 100  # in seconds
  crop_width: 900
  crop_height: 768
  scale_height: 1242
  overwrite: False

# PCA and pairwise correlations for sustained activity
coherence:
  comp_count: 10
  bin_size: 0.01
  win_sizes: [5, 10, 20, 30, 50, 75, 100, 150, 200, 300, 500, 750, 1000, 1500, 2000]  # in number of bins of bin_size
  sustained_start: 0.12

# Behavioral state decoding from neural activity
state_decoder:
  aep_type: 'avg_across_channels'
  kernel_size: '8'
  unit_mx_electrodes: []

segments:
  ensembles: False
  tgt_sta_min_pulses: 13
  bgr_sta_min_pulses: 12
  sil_sta_min_pulses: 12
  bgr_run_min_pulses: 2
  sil_run_min_pulses: 4
  dis_sta_min_pulses: 4
  strip_l:
    tgt: 2
    bgr: 1
    sil: 1
    dis: 1
  strip_r:
    tgt: 0
    bgr: 1
    sil: 1
    dis: 1
  visits:
    min_pulses: 8
    radius: 0.05

unit_match:
  sample_amount: 1000 # for both CV, at least 500 per CV
  spike_width: 61 # assuming 30khz sampling, 82 and 61 are common choices (KS1-3, KS4), covers the AP and space around needed for processing
  n_channels: 384 #neuropixels default, the number of channels EXCLUDING sync channels
  extract_good_units_only: False # bool, set to true if you want to only extract units marked as good 
  KS4_data: True #bool, set to true if using Kilosort, as KS4 spike times refer to start of waveform not peak
  samples_before: 20
  match_good_units_only: True # bool, set to true if you want to only match units marked as good
  require_phy_folder: False # bool, only include sessions with kilosort/.phy