# run snakemake from ../workflow folder:
# snakemake -n --configfile=../config/andrey/009266.yaml --use-conda --cores=20

blocks:  # blocks of pipeline to run
  meta: True         # pack main metadata into HDF5
  performance: True   # performance metrics
  DLC: True        # Deep lab cut
  MoSeq: True        # MoSeq
  descendants: True   # speed, HD etc. from MoSeq and others
  Audio: False       # process audio data
  LFP: True          # extract LFP
  neurosuite: False  # sorting with neurosuite / klustakwik
  kilosort: False  # sorting with kilosort
  units: True      # extract spike trains from sorted data
  AEPs: True         # extract Auditory Evoked Responses
  PSTH_bar: True
  PSTH_bootstrap: False
  PSTH_shuffle: False
  PSTH_bnMAPs: False
  spatial: False
  population: True
  coherence: False
  manifold_states: False
  metronome: False
  video: False
  sound_phase_lock: True
  segments: True
  activity_matrices: True
  ensembles: False
  covariance: False
  vectors: False
  CCR: True
  state_decoder_ev_su: True

session_IDs:  
# 009266
  - "009266_hippoSIT_2023-04-17_17-04-17"
  - "009266_hippoSIT_2023-04-18_10-10-37"
  - "009266_hippoSIT_2023-04-18_17-03-10"
  - "009266_hippoSIT_2023-04-19_10-33-51"
  - "009266_hippoSIT_2023-04-20_08-57-39"
  - "009266_hippoSIT_2023-04-21_08-43-00"
  - "009266_hippoSIT_2023-04-21_13-12-31"
  - "009266_hippoSIT_2023-04-24_10-08-11"
  - "009266_hippoSIT_2023-04-24_16-56-55"
  - "009266_hippoSIT_2023-04-26_08-20-17"
  - "009266_hippoSIT_2023-05-02_12-22-14"
  - "009266_hippoSIT_2023-05-04_19-47-15"
  - "009266_hippoSIT_2023-05-22_09-27-22"
  - "009266_hippoSIT_2023-05-23_09-18-05"
  - "009266_hippoSIT_2023-05-25_15-55-57"
  - "009266_hippoSIT_2023-06-14_08-21-23"
  - "009266_hippoSIT_2023-06-19_08-58-35"

# source of raw data
#src_path: "/home/sobolev/nevermind_ag-grothe/Andrey/data/"
src_path: "/mnt/nevermind.data-share/ag-grothe/AG_Pecka/data/raw"

# destination for processed data
#dst_path: "/home/sobolev/nevermind_ag-grothe/Andrey/sandbox/4Kate/processed"
dst_path: "/mnt/nevermind.data-share/ag-grothe/AG_Pecka/data/processed/"

# neurosuite / klustakwik config files
template_xml: "/mnt/nevermind.data-share/ag-grothe/AG_Pecka/data/raw/013829/neurosuite.xml"
template_manual_json: "/mnt/nevermind.data-share/ag-grothe/AG_Pecka/data/raw/013829/manual.json"
ndm_path: "/mnt/nevermind.data-share/ag-grothe/AG_Pecka/apps/ndm/usr/bin/"
kkwik_path: "/mnt/nevermind.data-share/ag-grothe/AG_Pecka/apps/kkwik/"
kwik_args: "-PenaltyMix 1.0 -MinClusters 85 -MaxClusters 85 -MaxPossibleClusters 200 -UseFeatures"

kilosort:
  settings_path: "/mnt/nevermind.data-share/ag-grothe/AG_Pecka/data/raw/013829/kilosort.json"
  probe_path: "/mnt/nevermind.data-share/ag-grothe/AG_Pecka/data/raw/013829/probe.json"
  save_preprocessed: False

# single units config: which sorter to use
units:
  source: 'neurosuite'

# deep lab cut config files
dlc_config_path: "/home/sobolev/nevermind_ag-grothe/Miguel/DeepLabCut/TrainedModels/implantedSIT-Miguel-2023-06-23/config.yaml"
dlc_shuffle: 3
dlc_trainingsetindex: 0

# moseq config files
moseq_model_path: '/mnt/nevermind.data-share/ag-grothe/Miguel/MoSeq/TrainedModels/hippoSIT2023_noTail_unfiltered/2023_07_13-15_08_10'
cuda_device_to_use: 1

# LFP configuration
lfp:
  n_channels: 64
  source_rate: 30000 # original LFP sampling rate in Hz
  target_rate: 1000  # target LFP sampling rate in Hz
  chunk_size_sec: 10  # chunk size for conversion in seconds
  aep_dur: 0.25  # Auditory evoked response duration in sec
  aep_pre: 0.12
  aep_sig: 0.125
  artifacts:
    z_thresh: 5.0
    win_ms: 100
    step_ms: 50
    min_dur_ms: 100
    merge_gap_ms: 1000
  aep_ITPC:
    area: 'A1'
    metric: 'avg_across_channels'  # weighted_avg, zscored_avg, raw_AEPs (last is 2D)
  baseline:
    min_duration_ms: 500
    stationary_thresh: 0.04  # m/s
  EV_SU:
    kernel_sizes: [0, 4, 8, 12, 16]

sound_phase_lock:
  n_shuffles: 100
  ipi_for_shuffle: 0.25
  
# analysis configurations
psth:
  micro:
    latency: 0.25
    bin_count: 31
    figsize: 2.5
  macro:
    latency: 7.25
    bin_count: 31
  bootstrap:
    latency: 0.25
    bin_count: 51
    boot_iter_count: 100
    shuf_iter_count: 100

# neural manifolds
nMAP_electrodes:
    '013829': [1, 2]
    '009265': [1, 2]
    '009266': [1, 2]
    '57': [1]
    '60': [1, 2]

nMAP_segmentation:
  ft: 'tSNE'
  fp: 70
  speed_thresh: 0.04  # m/s
  margin: 5
  sigma: 0.1
  bin_count: 100
  shuffle_iter_count: 100

# behavioral manifolds
bMAP_segmentation:
  ft: 'tSNE'
  fp: 70
  speed_thresh: 0.04  # m/s
  margin: 5
  sigma: 0.12
  bin_count: 100
  shuffle_iter_count: 100

# metronome
metronome:
  split_ratio: 0.5

# Evoked / sustained manifold
nMAP_EV_SU:
  bin_size: 0.01
  ev_su_lag: 0.12
  k_width: 200  # sampled as activity matrix per event bins (250ms)
  smooth_su_size: 4  #  rectangular kernel size to smooth sustained part
  smooth_ev_size: 4  #  rectangular kernel size to smooth evoked part

# unit matrix + video merging
video:
  duration: 300  # in seconds
  overlap: 100  # in seconds
  crop_width: 900
  crop_height: 768
  scale_height: 1242
  overwrite: False

# PCA and pairwise correlations for sustained activity
coherence:
  comp_count: 10
  bin_size: 0.01
  win_sizes: [5, 10, 20, 30, 50, 75, 100, 150, 200, 300, 500, 750, 1000, 1500, 2000]  # in number of bins of bin_size
  sustained_start: 0.12

PSTH_micro_bnMAPs:
  units: ['1-13', '2-4', '2-5']  # leave empty for all units

segments:
  ensembles: False
  tgt_sta_min_pulses: 20
  bgr_sta_min_pulses: 12
  sil_sta_min_pulses: 12
  bgr_run_min_pulses: 2
  sil_run_min_pulses: 4
  dis_sta_min_pulses: 4
  visits:
    min_pulses: 8
    radius: 0.05

AEPs:
  aep_lfp_metrics_thresholds:
    "009266_hippoSIT_2023-04-17_17-04-17": [1200, 300]  # SNR, amplitude
    "009266_hippoSIT_2023-04-18_10-10-37": [1500, 400]
    "009266_hippoSIT_2023-04-18_17-03-10": [2000, 300]
    "009266_hippoSIT_2023-04-19_10-33-51": [3000, 400]
