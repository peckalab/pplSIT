# run snakemake from ../workflow folder:
# snakemake -n --configfile=../config/andrey/013829.yaml --use-conda --cores=20

blocks:  # blocks of pipeline to run
  meta: True         # pack main metadata into HDF5
  performance: True   # performance metrics
  DLC: False        # Deep lab cut
  MoSeq: False        # MoSeq
  descendants: False   # speed, HD etc. from MoSeq and others
  Audio: False       # process audio data
  LFP: True          # extract LFP
  neurosuite: False  # sorting with neurosuite / klustakwik
  kilosort: False  # sorting with kilosort
  units: True      # extract spike trains from sorted data
  AEPs: True         # extract Auditory Evoked Responses
  PSTH_bar: True
  PSTH_bootstrap: True
  PSTH_shuffle: True
  PSTH_bnMAPs: False
  spatial: False
  population: True
  coherence: False
  manifold_states: False
  metronome: False
  video: False
  sound_phase_lock: True
  segments: True
  activity_matrices: False
  ensembles: False
  covariance: False
  vectors: False
  CCR: True
  state_decoder_ev_su: True

