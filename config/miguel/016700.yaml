  meta: False         # pack main metadata into HDF5
  performance: False   # performance metrics
  DLC: False        # Deep lab cut
  MoSeq: False        # MoSeq
  descendants: False   # speed, HD etc. from MoSeq and others
  Audio: False       # process audio data
  LFP: False          # extract LFP
  neurosuite: False  # sorting with neurosuite / klustakwik
  kilosort: True  # sorting with kilosort
  units: False      # extract spike trains from sorted data
  AEPs: False         # extract Auditory Evoked Responses
  PSTH_bar: True
  PSTH_bootstrap: False
  PSTH_shuffle: False
  PSTH_bnMAPs: False
  spatial: False
  population: False
  coherence: False
  manifold_states: False
  metronome: False
  video: False
  sound_phase_lock: False
  segments: False
  activity_matrices: False
  ensembles: False
  covariance: False
  vectors: False
  state_decoder_unit_mx: False
  bombcell: False # Bombcell quality control on Kilosort streams
  unit_match: False # run unit matching across all sessions of an animal

