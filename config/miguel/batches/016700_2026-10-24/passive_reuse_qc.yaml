# Approved 016700 additions, 2026-10-24. Standalone config over config/default.yaml.
# Only metadata/sound synchronization, sorting and Bombcell are enabled.
# Excluded: 016700_SIT_2025-12-08_09-27-06 -- unexpected two recording segments;
# intended to be one recording. Do not assemble automatically.
# Deferred: 016700_SIT_2025-12-16_09-00-06 -- non-increasing ADC timestamps.
# A1 QC thresholds match the saved 017276 and 016700 Bombcell parameters.
# PSTH settings are intentionally not selected here; no PSTH jobs are enabled.
src_path: /mnt/nevermind.data-share/ag-grothe/AG_Pecka/data/raw
