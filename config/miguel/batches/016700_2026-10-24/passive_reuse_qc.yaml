template_manual_json: /mnt/nevermind.data-share/ag-grothe/AG_Pecka/data/raw/016700/manual.json
pack:
  drift_coeff: 1.6666e-05
  adc_sync:
    enabled: true
    # Bounded in-memory repair; original timestamp files remain unchanged.
    repair_timestamps: true
    f_lo: 500.0
    f_hi: 1500.0
    scheduler_threads: 8
    io_heavy: 1
kilosort:
