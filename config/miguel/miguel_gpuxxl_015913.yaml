blocks:  # blocks of pipeline to run
  meta: True         # pack main metadata into HDF5
  performance: True   # performance metrics
  DLC: False        # Deep lab cut
  MoSeq: False        # MoSeq
  descendants: False   # speed, HD etc. from MoSeq and others
  Audio: False       # process audio data
  LFP: False          # extract LFP
  neurosuite: False  # sorting with neurosuite / klustakwik
  kilosort: False #True  # sorting with kilosort
  units: True #True      # extract spike trains from sorted data
  AEPs: False         # extract Auditory Evoked Responses
  PSTH_bar: False #True
  PSTH_bootstrap: False
  PSTH_shuffle: False
  PSTH_bnMAPs: False
  spatial: False #True
  population: False
  coherence: False
  manifold_states: False
  metronome: False
  video: False
  sound_phase_lock: False

