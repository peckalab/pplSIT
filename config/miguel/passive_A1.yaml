# run snakemake from ../workflow folder:
# snakemake -n --configfile=../config/andrey/017276.yaml --use-conda --cores=20
# 
# find files / modified date
# find . -name phy.log -printf "%p %TY-%Tm-%Td %TH:%TM:%TS %Tz\n"
# 
# mount nevermind via SSHFS
# sshfs sobolev@10.153.172.1:/nevermind.neuro/share/ag-grothe nevermind
# sshfs andrey@10.153.170.1:/storage2 storage2
# unmount
# sudo diskutil umount force /Users/andrey/nevermind

blocks:  # blocks of pipeline to run
  meta: True         # pack main metadata into HDF5
  performance: False   # performance metrics
  DLC: False        # Deep lab cut
  MoSeq: False        # MoSeq
  descendants: False   # speed, HD etc. from MoSeq and others
  Audio: False       # process audio data
  LFP: False          # extract LFP
  neurosuite: False  # sorting with neurosuite / klustakwik
  kilosort: True  # sorting with kilosort
  units: False      # extract spike trains from sorted data
  AEPs: False         # extract Auditory Evoked Responses
  PSTH_bar: True
  PSTH_bootstrap: False
  PSTH_shuffle: False
  STRF_passive: True
  PSTH_bnMAPs: False
  spatial: False
  population: False
  coherence: False
  manifold_states: False
  metronome: False
  video: False
  sound_phase_lock: False
  segments: False
  activity_matrices: False
  ensembles: False
  covariance: False
  vectors: False
  state_decoder_unit_mx: False
  bombcell: True # Bombcell quality control on Kilosort streams
  raw_waveforms: False # extract raw waveforms for unit matching (session level)


session_IDs:
  # 017276
  - "017276_SIT_passive_2026-04-16_19-36-14"
  - "017276_SIT_passive_2026-03-13_18-25-54"
  - "017276_SIT_passive_2026-03-02_18-47-19"
  - "017276_SIT_passive_2026-03-01_20-06-02"

  

# source of raw data
#src_path: "/home/sobolev/nevermind_ag-grothe/Andrey/data/"
src_path: "/mnt/nevermind.data-share/ag-grothe/AG_Pecka/data/raw"

# destination for processed data
#dst_path: "/home/sobolev/nevermind_ag-grothe/Andrey/sandbox/4Kate/processed"
dst_path: "/mnt/nevermind.data-share/ag-grothe/AG_Pecka/data/processed/"

# template_manual_json: "/mnt/nevermind.data-share/ag-grothe/AG_Pecka/data/raw/017388/manual_original.json"
template_manual_json: "/mnt/nevermind.data-share/ag-grothe/AG_Pecka/data/raw/017276/manual.json"
# template_manual_json: "/mnt/nevermind.data-share/ag-grothe/AG_Pecka/data/raw/017388/manual_version2.json"
# template_manual_json: "/mnt/nevermind.data-share/ag-grothe/AG_Pecka/data/raw/017388/manual_version3.json"

pack:
  drift_coeff: 0.000016666
  adc_sync:
    enabled: True
    f_lo: 250.0
    f_hi: 15000.0

kilosort:
  settings_path: "/mnt/nevermind.data-share/ag-grothe/AG_Pecka/data/raw/017276/kilosort.json"
  #probe_path: "/mnt/nevermind.data-share/ag-grothe/AG_Pecka/data/raw/017276/probe.json"
  save_preprocessed: False
  cuda_device: 3

# single units config: which sorter to use
units:
  source: 'kilosort'
  label_source: 'bombcell' # ks | bombcell

# deep lab cut config files
#dlc_config_path: "/home/sobolev/nevermind_ag-grothe/Miguel/DeepLabCut/TrainedModels/implantedSIT-Miguel-2023-06-23/config.yaml"
dlc_config_path: "/mnt/nevermind.data-share/ag-grothe/Miguel/DeepLabCut/TrainedModels/implantedSIT_newSetup-Miguel-2025-01-24/config.yaml"
dlc_shuffle: 1
dlc_trainingsetindex: 1

# moseq config files
moseq_model_path: '/mnt/nevermind.data-share/ag-grothe/Miguel/MoSeq/TrainedModels/hippoSIT2023_noTail_unfiltered/2023_07_13-15_08_10'
cuda_device_to_use: 3

# LFP configuration
lfp:
  n_channels: 384
  source_rate: 30000 # original LFP sampling rate in Hz
  target_rate: 1000  # target LFP sampling rate in Hz
  chunk_size_sec: 10  # chunk size for conversion in seconds
  aep_dur: 0.25  # Auditory evoked response duration in sec
  aep_pre: 0.12
  aep_sig: 0.125
  artifacts:
    z_thresh: 8.0
    win_ms: 200
    step_ms: 100
    min_dur_ms: 500
    merge_gap_ms: 2000
  aep_ITPC:
    area: 'any'
    metric: 'avg_across_channels'  # weighted_avg, zscored_avg, raw_AEPs (last is 2D)
  baseline:
    min_duration_ms: 500
    stationary_thresh: 0.04  # m/s
  

# analysis configurations
psth:
  micro:
    latency: 0.25
    bin_count: 151
    shuf_iter_count: 100
    figsize: 4
  macro:
    latency: 7.25
    bin_count: 31
  bootstrap:
    latency: 0.25
    bin_count: 51
    boot_iter_count: 100

# neural manifolds
nMAP_electrodes:
    '009265': [1, 2]
    '009266': [1, 2]
    '57': [1]
    '60': [1, 2]

nMAP_segmentation:
  ft: 'tSNE'
  fp: 70
  speed_thresh: 0.04  # m/s
  margin: 5
  sigma: 0.1
  bin_count: 100
  shuffle_iter_count: 100

# behavioral manifolds
bMAP_segmentation:
  ft: 'tSNE'
  fp: 70
  speed_thresh: 0.04  # m/s
  margin: 5
  sigma: 0.12
  bin_count: 100
  shuffle_iter_count: 100

# metronome
metronome:
  split_ratio: 0.5

# Evoked / sustained manifold
nMAP_EV_SU:
  bin_size: 0.01
  ev_su_lag: 0.12
  k_width: 200  # sampled as activity matrix bins (10ms)
  smooth_su_size: 4  #  rectangular kernel size to smooth sustained part
  smooth_ev_size: 20  #  gaussian kernel size to smooth evoked part

# unit matrix + video merging
video:
  duration: 300  # in seconds
  overlap: 100  # in seconds
  crop_width: 900
  crop_height: 768
  scale_height: 1242
  overwrite: False

# PCA and pairwise correlations for sustained activity
coherence:
  comp_count: 10
  bin_size: 0.01
  win_sizes: [5, 10, 20, 30, 50, 75, 100, 150, 200, 300, 500, 750, 1000, 1500, 2000]  # in number of bins of bin_size
  sustained_start: 0.12

PSTH_micro_bnMAPs:
  units: []  # leave empty for all units

sound_phase_lock:
  n_shuffles: 100
  ipi_for_shuffle: 0.25

sound_phase_lock:
  n_shuffles: 100
  ipi_for_shuffle: 0.25

segments:
  ensembles: False
  tgt_sta_min_pulses: 13
  bgr_sta_min_pulses: 12
  sil_sta_min_pulses: 12
  bgr_run_min_pulses: 2
  sil_run_min_pulses: 4
  dis_sta_min_pulses: 4
  visits:
    min_pulses: 8
    radius: 0.05
  strip_l:
    tgt: 2
    bgr: 1
    sil: 1
    dis: 1
  strip_r:
    tgt: 0
    bgr: 1
    sil: 1
    dis: 1

vectors:
  min_mfr: 0.005
  unit_mx:
    group: 'mx_50ms'
    type: 'mx_sm20_z'
    step: 5
  units_to_exclude:
    '014393_ppcSIT_2025-04-23_20-27-09': ['2-300', '3-350']

bombcell:
  threads: 32
  resource_slots: 1
  io_heavy: 1
  unit_match_waveforms: True
  force_unit_match_waveform_reextract: False
  stage_raw_dat:
    enabled: True
    root: "/local/scratch/bengala/pplSIT/bombcell_stage"
    cleanup: True
    min_free_gb: 20

io_heavy_lock:
  enabled: False
  path: "/tmp/pplSIT_io_heavy.lock"
